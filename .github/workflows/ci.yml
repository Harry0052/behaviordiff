name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "21"

      - name: Check, install, and package
        run: ./gradlew check installDist distZip --no-daemon

      - name: Demo the duplicate cancellation
        run: |
          set +e
          ./build/install/behaviordiff/bin/behaviordiff demo \
            --case duplicate-cancel \
            --output out/duplicate-cancel.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "duplicate-cancel must exit 1 when the builds differ, got $code"
            exit 1
          fi
          grep -q '"status":"changes"' out/duplicate-cancel.json
          grep -q '"businessKey":"ship-cancel:O-1"' out/duplicate-cancel.json
          grep -q '"leftCount":1' out/duplicate-cancel.json
          grep -q '"rightCount":2' out/duplicate-cancel.json
          grep -q '"key":"R-1"' out/duplicate-cancel.json

      - name: Identical control
        run: |
          ./build/install/behaviordiff/bin/behaviordiff demo \
            --case identical-control \
            --output out/identical.json
          grep -q '"status":"identical"' out/identical.json

      - name: Upload demo and test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: behaviordiff-ci
          path: |
            out/duplicate-cancel.json
            out/identical.json
            build/reports/tests/test
            build/distributions/behaviordiff-0.1.0.zip
          if-no-files-found: error
